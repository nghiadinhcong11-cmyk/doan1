version: '3.8'

services:
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: pos_api
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=${SUPABASE_CONNECTION_STRING:?SUPABASE_CONNECTION_STRING must be set}
      - Jwt__Secret=${JWT_SECRET:?JWT_SECRET must be set}
      - Gemini__ApiKey=${GEMINI_API_KEY:?GEMINI_API_KEY must be set}
    ports:
      - "5000:5000"
